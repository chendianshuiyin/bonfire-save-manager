name: Windows build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Bonfire.App/Bonfire.App.csproj -c Release
      - run: dotnet run --project tests/Bonfire.Tests -c Release
      - run: dotnet publish src/Bonfire.App/Bonfire.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/BonfireSave-win-x64
      - shell: pwsh
        run: |
          Copy-Item README.md,LICENSE,THIRD-PARTY-NOTICES.md dist/BonfireSave-win-x64/
          Copy-Item licenses dist/BonfireSave-win-x64/ -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: BonfireSave-win-x64
          path: dist/BonfireSave-win-x64/
